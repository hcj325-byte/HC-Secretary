plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hc.secretary'
    compileSdk 36

    defaultConfig {
        applicationId "com.hc.secretary"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "1.0.5"
    }

    signingConfigs {
        release {
            storeFile file('../../signing/release.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'hc'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress "html"
    }
    lint {
        abortOnError false
    }
}

dependencies {
}
