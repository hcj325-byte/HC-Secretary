name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check assets
        run: |
          ls -la android/app/src/main/assets/
          echo "---"
          wc -c android/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Check APK size
        run: |
          find android -name '*.apk' -exec ls -la {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HC-Secretary-G
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          gh release delete v38 --yes || true
          gh release create "v38" "$APK" --title "HC 비서실 G v38" --latest --notes "With assets"
