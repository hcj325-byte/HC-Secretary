name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Get version
        id: ver
        run: |
          echo "code=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          gh release create "v${{ steps.ver.outputs.code }}" "$APK" --latest --title "HC 비서실 G v${{ steps.ver.outputs.code }}"
